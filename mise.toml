[tools]
rust = { version = "1.99.0", components = "rustfmt,clippy" }

[tasks.check]
description = "Format check, lint and test the workspace"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
]

[tasks.demo]
description = "Explore the demo Axum server, starting at the place_order handler"
run = "cargo run -p codeviz -- demo/axum-server --entry handlers::place_order"

[tasks.trace]
description = "Print a text trace: mise run trace -- <entry>"
run = "cargo run -p codeviz -- demo/axum-server --print-trace --entry"
