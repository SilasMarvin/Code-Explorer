[tools]
rust = { version = "1.99.0", components = "rustfmt,clippy,rust-analyzer,rust-src" }

[tasks.check]
description = "Format check, lint and test the workspace"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
]

[tasks.demo-docs]
description = "Regenerate the demo IR documents"
run = [
  "cargo run -q -p codeviz -- analyze demo/axum-server -o demo/out/axum-server.json",
  "cargo run -q -p codeviz -- analyze demo/python-service -o demo/out/python-service.json",
  "cargo run -q -p codeviz -- validate demo/out/*.json",
]

[tasks.demo]
description = "Explore the Rust demo, starting at POST /users/{id}/orders"
run = "cargo run -p codeviz -- view demo/out/axum-server.json --focus 'POST /users/{id}/orders'"
