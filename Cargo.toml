[workspace]
resolver = "3"
members = ["crates/*", "demo/axum-server"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/silas/code-explorer"

[workspace.dependencies]
codeviz-graph = { path = "crates/codeviz-graph" }
codeviz-layout = { path = "crates/codeviz-layout" }
codeviz-rust = { path = "crates/codeviz-rust" }
codeviz-viewer = { path = "crates/codeviz-viewer" }

anyhow = "1.0.104"
axum = "0.8.9"
bevy = "0.20.0"
bevy_egui = "0.43.1"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_precision_loss = "allow"

# Bevy is unusably slow at opt-level 0.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
