[workspace]
resolver = "3"
members = ["crates/*", "demo/axum-server"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/silas/code-explorer"

[workspace.dependencies]
codeviz-core = { path = "crates/codeviz-core" }
codeviz-ir = { path = "crates/codeviz-ir" }
codeviz-layout = { path = "crates/codeviz-layout" }
codeviz-python = { path = "crates/codeviz-python" }
codeviz-rust = { path = "crates/codeviz-rust" }
codeviz-viewer = { path = "crates/codeviz-viewer" }

anyhow = "1.0.104"
axum = "0.8.9"
blake3 = "1.8.7"
# Only what the viewer uses: meshes, lights and gizmo rings in 3D, egui over them, the
# window, and PNG snapshots. No gamepad, audio, scenes, glTF, Bevy UI or text, or
# picking (each a thread or a build the viewer does not need).
bevy = { version = "0.20.0", default-features = false, features = [
    "std",
    "multi_threaded",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "x11",
    "wayland",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_gizmos_render",
    "tonemapping_luts",
    "zstd_rust",
    "png",
] }
bevy_egui = { version = "0.43.1", default-features = false, features = [
    "render",
    "default_fonts",
    "manage_clipboard",
] }
clap = { version = "4.6.7", features = ["derive"] }
glam = "0.33.12"
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tree-sitter = "0.27.1"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_precision_loss = "allow"

# Bevy is unusably slow at opt-level 0.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
