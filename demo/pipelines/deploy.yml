# orders-deploy: build, test and ship the orders platform (demo/axum-server).
#
# Pushes to any branch build and test. Pushes to main also publish the image and,
# once someone releases it, migrate and deploy production.

agents:
  queue: build

env:
  CARGO_TERM_COLOR: always
  IMAGE: registry.example.com/orders/axum-server

steps:
  - label: ":rust: Lint"
    key: lint
    commands:
      - cargo fmt --all --check
      - cargo clippy -p axum-server --all-targets -- -D warnings
    plugins:
      - docker-compose#v5.10.0:
          run: ci
          config: demo/axum-server/docker-compose.ci.yml

  - label: ":hammer: Build"
    key: build
    command: ./scripts/build.sh --release
    artifact_paths:
      - target/release/axum-server
      - target/release/axum-server.sha256
    retry:
      automatic: true

  - label: ":test_tube: Unit tests"
    key: unit-tests
    depends_on: build
    command: |
      cargo nextest run -p axum-server \
        --partition hash:$((BUILDKITE_PARALLEL_JOB + 1))/$BUILDKITE_PARALLEL_JOB_COUNT
    parallelism: 4
    retry:
      automatic:
        - exit_status: -1 # agent lost
          limit: 2

  - label: ":test_tube: Test {{matrix.os}} / rust {{matrix.rust}}"
    key: test-matrix
    depends_on: build
    command: cargo test -p axum-server --locked
    agents:
      queue: test
    matrix:
      setup:
        os: [linux, macos]
        rust: ["1.99", nightly]
      adjustments:
        - with: { os: linux, rust: nightly }
          soft_fail: true
        - with: { os: macos, rust: nightly }
          soft_fail: true

  - label: ":lock: cargo audit"
    command: cargo audit --deny warnings
    soft_fail:
      - exit_status: 1

  - wait

  - label: ":docker: Build image"
    key: image
    command: ./scripts/docker-build.sh "$IMAGE:$BUILDKITE_COMMIT"
    artifact_paths: image-digest.txt

  - label: ":globe_with_meridians: Integration tests"
    key: integration
    depends_on: [image, unit-tests, test-matrix]
    commands:
      - buildkite-agent artifact download image-digest.txt .
      - ./scripts/integration.sh
    plugins:
      - docker-compose#v5.10.0:
          run: integration
          config: demo/axum-server/docker-compose.ci.yml
    retry:
      automatic:
        limit: 2

  - wait

  - label: ":docker: Push image"
    key: push-image
    if: build.branch == "main"
    command: ./scripts/docker-push.sh "$IMAGE:$BUILDKITE_COMMIT"
    concurrency_group: orders/registry
    concurrency: 1

  - block: ":rocket: Release to production?"
    key: release
    if: build.branch == "main"
    prompt: Deploys the image built from this commit to production.

  - group: ":rocket: Deploy production"
    key: deploy
    if: build.branch == "main"
    steps:
      - label: ":database: Migrate"
        key: migrate
        trigger: orders-migrations
        build:
          commit: $BUILDKITE_COMMIT
          branch: $BUILDKITE_BRANCH
          env:
            TARGET: production

      - label: ":kubernetes: Deploy api"
        key: deploy-api
        depends_on: migrate
        command: ./scripts/deploy.sh production api
        agents:
          queue: deploy
        concurrency_group: orders/production
        concurrency: 1

      - label: ":kubernetes: Deploy worker"
        key: deploy-worker
        depends_on: migrate
        command: ./scripts/deploy.sh production worker
        agents:
          queue: deploy
        concurrency_group: orders/production
        concurrency: 1

      - wait

      - label: ":fire_engine: Smoke test"
        key: smoke
        command: ./scripts/smoke.sh https://orders.example.com
        retry:
          automatic:
            limit: 3

  - label: ":mag: Post-deploy checks"
    key: post-deploy
    depends_on: deploy
    if: build.branch == "main"
    trigger: post-deploy-checks
    async: true
    build:
      commit: $BUILDKITE_COMMIT

  - wait: ~
    continue_on_failure: true

  - label: ":speech_balloon: Notify"
    command: ./scripts/notify.sh "#orders-deploys"
